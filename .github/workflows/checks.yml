name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native test libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev
      - name: Check sources and regression tests
        run: ./bravion check
      - name: Test Rust Store
        run: cargo test --locked --manifest-path ai-tools/Cargo.toml
